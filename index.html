<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON to Excel Converter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        .custom-shadow { box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1); }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-900">

    <div class="max-w-4xl mx-auto py-12 px-4">
        <header class="text-center mb-10">
            <h1 class="text-3xl font-bold text-blue-700 mb-2">Konverter JSON ke Excel</h1>
            <p class="text-slate-600">Tempelkan data JSON Anda dan unduh sebagai file Excel secara instan.</p>
        </header>

        <div class="bg-white rounded-2xl p-6 custom-shadow border border-slate-200">
            <div class="mb-6">
                <label for="jsonInput" class="block text-sm font-semibold text-slate-700 mb-2">Input JSON:</label>
                <textarea 
                    id="jsonInput" 
                    class="w-full h-64 p-4 font-mono text-sm border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"
                    placeholder='[{"nama": "Budi", "usia": 25}, {"nama": "Santi", "usia": 22}]'
                ></textarea>
            </div>

            <div id="errorMessage" class="hidden mb-6 p-4 bg-red-50 border border-red-200 text-red-700 rounded-xl text-sm">
                JSON tidak valid. Pastikan formatnya benar (array of objects).
            </div>

            <div class="flex flex-wrap gap-4 items-center justify-between">
                <div class="flex gap-4">
                    <button 
                        onclick="convertToExcel()" 
                        class="px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl transition-colors flex items-center gap-2"
                    >
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
                        Unduh Excel (.xlsx)
                    </button>
                    <button 
                        onclick="clearInput()" 
                        class="px-6 py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-xl transition-colors"
                    >
                        Bersihkan
                    </button>
                </div>
                <span id="statusText" class="text-sm text-slate-500"></span>
            </div>
        </div>

        <div id="previewSection" class="mt-10 hidden">
            <h2 class="text-xl font-bold mb-4 text-slate-800">Pratinjau Data</h2>
            <div class="overflow-x-auto bg-white rounded-xl border border-slate-200 custom-shadow">
                <table id="previewTable" class="w-full text-left text-sm border-collapse">
                    <!-- Table content generated via JS -->
                </table>
            </div>
        </div>
    </div>

    <script>
        function showMessage(msg, isError = true) {
            const errDiv = document.getElementById('errorMessage');
            errDiv.textContent = msg;
            errDiv.className = isError ? 
                "mb-6 p-4 bg-red-50 border border-red-200 text-red-700 rounded-xl text-sm block" : 
                "mb-6 p-4 bg-green-50 border border-green-200 text-green-700 rounded-xl text-sm block";
            
            if (!isError) {
                setTimeout(() => { errDiv.classList.add('hidden'); }, 3000);
            }
        }

        function clearInput() {
            document.getElementById('jsonInput').value = '';
            document.getElementById('errorMessage').classList.add('hidden');
            document.getElementById('previewSection').classList.add('hidden');
            document.getElementById('statusText').textContent = '';
        }

        function convertToExcel() {
            const input = document.getElementById('jsonInput').value.trim();
            const statusText = document.getElementById('statusText');
            
            if (!input) {
                showMessage("Mohon masukkan data JSON terlebih dahulu.");
                return;
            }

            try {
                const data = JSON.parse(input);
                
                // Pastikan data adalah array
                const dataArray = Array.isArray(data) ? data : [data];

                // Proses dengan XLSX
                const worksheet = XLSX.utils.json_to_sheet(dataArray);
                const workbook = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(workbook, worksheet, "Data");

                // Download file
                XLSX.writeFile(workbook, "konversi_data.xlsx");
                
                showMessage("Berhasil mengonversi! File sedang diunduh.", false);
                generatePreview(dataArray);

            } catch (e) {
                console.error(e);
                showMessage("Gagal mengonversi. Pastikan format JSON Anda valid.");
            }
        }

        function generatePreview(data) {
            const previewSection = document.getElementById('previewSection');
            const table = document.getElementById('previewTable');
            
            if (data.length === 0) return;

            previewSection.classList.remove('hidden');
            table.innerHTML = '';

            // Headers
            const headers = Object.keys(data[0]);
            const thead = document.createElement('thead');
            const headerRow = document.createElement('tr');
            headerRow.className = "bg-slate-100 border-bottom border-slate-200";
            
            headers.forEach(h => {
                const th = document.createElement('th');
                th.className = "px-4 py-3 font-semibold text-slate-700";
                th.textContent = h;
                headerRow.appendChild(th);
            });
            thead.appendChild(headerRow);
            table.appendChild(thead);

            // Body (Limit to 10 rows for preview)
            const tbody = document.createElement('tbody');
            data.slice(0, 10).forEach((row, i) => {
                const tr = document.createElement('tr');
                tr.className = i % 2 === 0 ? "bg-white" : "bg-slate-50";
                tr.className += " border-b border-slate-100";
                
                headers.forEach(h => {
                    const td = document.createElement('td');
                    td.className = "px-4 py-3 text-slate-600";
                    td.textContent = typeof row[h] === 'object' ? JSON.stringify(row[h]) : row[h];
                    tr.appendChild(td);
                });
                tbody.appendChild(tr);
            });
            table.appendChild(tbody);
        }
    </script>
</body>
</html>
